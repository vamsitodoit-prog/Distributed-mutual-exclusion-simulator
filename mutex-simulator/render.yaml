# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the simulator as a free static site. Tests run on every build;
# a failing test blocks the deploy.
services:
  - type: web
    name: distributed-mutex-simulator
    runtime: static
    buildCommand: npm test
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.js
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.css
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
